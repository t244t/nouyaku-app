<!-- =========================================================
     今月の提案カード  ―  index.html 用スニペット
     ① 下の <style> を既存 <style> 内（またはhead）に追加
     ② <section> をホームの好きな位置に貼る
     ③ <script> を既存スクリプト群の末尾に追加
     GAS_URL 定数がある場合はそれを自動利用します。
     ========================================================= -->

<!-- ① CSS（tips- 接頭辞で衝突回避） -->
<style>
.tips-card{background:#fff;border:1px solid #e3e8e0;border-radius:14px;
  padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tips-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tips-title{font-weight:700;font-size:16px;color:#2e7d32}
.tips-refresh{border:none;background:transparent;font-size:18px;cursor:pointer;
  line-height:1;transition:transform .3s}
.tips-refresh:active{transform:rotate(180deg)}
.tips-section{margin:10px 0}
.tips-section h4{margin:0 0 4px;font-size:13px;color:#555;font-weight:700}
.tips-section ul{margin:0;padding-left:18px}
.tips-section li{font-size:14px;line-height:1.6;color:#333}
.tips-empty{color:#999;font-size:13px}
.tips-loading{color:#888;font-size:14px;padding:8px 0}
.tips-meta{margin-top:8px;font-size:11px;color:#aaa;text-align:right}
</style>

<!-- ② カード本体 -->
<section id="monthlyTipsCard" class="tips-card">
  <div class="tips-head">
    <span class="tips-title">📅 今月の提案</span>
    <button id="tipsRefresh" class="tips-refresh" title="再生成">🔄</button>
  </div>
  <div id="tipsBody" class="tips-body">
    <div class="tips-loading">読み込み中…</div>
  </div>
  <div id="tipsMeta" class="tips-meta"></div>
</section>

<!-- ③ スクリプト -->
<script>
(function () {
  // 既存の GAS デプロイURL定数（GAS_URL / API_URL 等）があれば自動で使用。
  var TIPS_GAS_URL =
    (typeof GAS_URL !== 'undefined') ? GAS_URL :
    (typeof API_URL !== 'undefined') ? API_URL :
    'https://script.google.com/macros/s/AKfycbzrKD24LhH_AKetCGNIAHvAFv44EaJIzDMOUI6YFVskY9W2dJj1aBOjW1Im3RBAZfqR/exec';

  var SECTIONS = [
    ['tasks',   '今月やる作業'],
    ['sowing',  '種まき・定植の適期'],
    ['harvest', '収穫できる作物'],
    ['pest',    '病害虫・獣害の注意'],
    ['sales',   '直売所おすすめ']
  ];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(data) {
    var body = document.getElementById('tipsBody');
    if (!data) { body.innerHTML = '<div class="tips-empty">取得できませんでした</div>'; return; }
    var html = '';
    SECTIONS.forEach(function (sec) {
      var arr = data[sec[0]] || [];
      if (!arr.length) return;
      html += '<div class="tips-section"><h4>' + esc(sec[1]) + '</h4><ul>';
      arr.forEach(function (item) { html += '<li>' + esc(item) + '</li>'; });
      html += '</ul></div>';
    });
    body.innerHTML = html || '<div class="tips-empty">提案がありません</div>';
  }

  function load(refresh) {
    var body = document.getElementById('tipsBody');
    var meta = document.getElementById('tipsMeta');
    body.innerHTML = '<div class="tips-loading">' + (refresh ? '再生成中…' : '読み込み中…') + '</div>';
    meta.textContent = '';
    var url = TIPS_GAS_URL + '?action=getMonthlyTips&refresh=' + (refresh ? '1' : '0') +
              '&_=' + Date.now();
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { render(null); return; }
        render(res.data);
        meta.textContent = res.month + '（' + (res.cached ? '保存済み' : '新規生成') + '）';
      })
      .catch(function () { render(null); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('tipsRefresh');
    if (btn) btn.addEventListener('click', function () { load(true); });
    load(false);
  });
})();
</script>
